name: fitjournal
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.0

dependencies:
  adaptive_platform_ui: ^1.0.1
  adaptive_theme: ^3.7.2
  animate_do: ^5.1.0
  audio_service: ^0.18.19
  audioplayers: ^6.7.1
  chewie: ^1.17.2
  connectivity_plus: ^7.3.1
  cupertino_icons: ^1.0.9
  file_picker: ^13.1.0
  flutter:
    sdk: flutter
  flutter_gen: ^5.15.0
  flutter_svg: ^2.3.0
  get_storage: ^2.1.1
  image_compare_slider: ^3.2.0
  image_picker: ^1.2.3
  liquid_glass: ^0.0.2
  liquid_glass_easy: ^4.3.1
  liquid_glass_widgets: ^1.7.1
  lottie: ^3.6.1
  open_file: ^4.0.0
  path: ^1.9.1
  path_provider: ^2.1.6
  percent_indicator: ^4.2.5
  permission_handler: ^11.0.2
  provider: ^6.1.5+1
  share_plus: ^13.3.0
  sleek_circular_slider: ^2.1.0
  sqflite: ^2.4.2+1
  video_player: ^2.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  build_runner: ^2.15.1
  flutter_gen_runner: ^5.15.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
    - assets/lottie/ 
  fonts:
   - family: Manrope
     fonts:
      - asset: assets/fonts/Manrope.ttf